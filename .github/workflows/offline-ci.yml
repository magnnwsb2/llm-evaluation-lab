name: Offline contracts and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Python 3.12 unit tests (no inference)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate versioned example
        env:
          PYTHONPATH: src
        run: python -m llm_eval validate experiments/smoke-001.json

  secret-scanner:
    name: Shared pre-commit-security skill (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout reviewed shared skills at immutable SHA
        uses: actions/checkout@v4
        with:
          repository: magnnwsb2/ai-engineering-skills
          ref: daa9a20410ae4fe1b088d6d422ecbae88eecbace
          path: .vendor/ai-engineering-skills
          persist-credentials: false
      - name: Scan all tracked application files as a staged snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          git archive HEAD | tar -x -C "$snapshot"
          git -C "$snapshot" init -q
          git -C "$snapshot" add -A
          (
            cd "$snapshot"
            python3 "$GITHUB_WORKSPACE/.vendor/ai-engineering-skills/skills/pre-commit-security/scripts/scan.py" --staged
          )
