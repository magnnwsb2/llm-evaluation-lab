name: Offline contracts and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Python 3.12 unit tests (no inference)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate versioned example
        env:
          PYTHONPATH: src
        run: |
          python -m llm_eval validate experiments/smoke-001.json
          python -m llm_eval validate experiments/advanced-001.json
          python -m llm_eval validate experiments/robustness-001.json
          python -m llm_eval validate experiments/smoke-002.json
          python -m llm_eval validate experiments/advanced-002.json
          python -m llm_eval validate experiments/robustness-002.json
      - name: Verify manually reviewed advanced statistics-only evidence
        run: python tools/validate_advanced_evidence.py
      - name: Verify reviewed robustness statistics-only evidence
        run: python tools/validate_robustness_evidence.py

  secret-scanner:
    name: Independent repository security gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan tracked files (no secrets or cross-repository access)
        run: python3 tools/security_check.py
