name: Cloudflare Workers AI smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-workers-ai-inference
  cancel-in-progress: false

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed model code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify one bounded Gemma 4 response
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from llm_eval.contracts import ContractError, load_experiment
          from llm_eval.run_evaluation import select_live_manifest
          from llm_eval.providers.cloudflare import ProviderError, infer
          from llm_eval.scoring import grade

          try:
              experiment = load_experiment(select_live_manifest("smoke-002"), Path("."))
              first = experiment.cases[0]
              observation = infer(
                  experiment, first,
                  account_id=os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""),
                  api_token=os.environ.get("CLOUDFLARE_API_TOKEN", ""),
              )
              status = grade(first, observation.text, latency_ms=observation.latency_ms).status
          except (ProviderError, ContractError):
              raise SystemExit("Manual smoke test: sanitized model/provider error; no upgrade or fallback.")
          print("Manual smoke: one bounded inference completed.")
          print("Strict case status:", status)
          print("Model:", experiment.model)
          print("No raw response, tokens, credentials or costs were printed.")
          PY
