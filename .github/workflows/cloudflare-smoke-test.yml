name: Cloudflare Workers AI smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Workers AI inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          if not token or not account:
              sys.exit("Missing Cloudflare token or account ID")
          model = "@cf/meta/llama-3.1-8b-instruct-fp8"
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/{model}"
          body = json.dumps({
              "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
              "max_tokens": 16,
              "temperature": 0
          }).encode()
          request = urllib.request.Request(
              url, data=body,
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"Cloudflare HTTP status: {exc.code}")
              sys.exit("Inference failed; review token permissions, model access, or free quota.")
          except Exception as exc:
              sys.exit(f"Connection failed: {type(exc).__name__}")
          if not payload.get("success", False):
              sys.exit("Cloudflare reported unsuccessful inference")
          result = payload.get("result") or {}
          answer = result.get("response", "")
          if not isinstance(answer, str) or not answer.strip():
              sys.exit("No text response returned")
          print("Cloudflare inference: SUCCESS")
          print("Response received: YES")
          print("Model:", model)
          PY
