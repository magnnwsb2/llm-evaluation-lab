name: Manual graded LLM evaluation

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Choose one reviewed, capped experiment (3 calls maximum)
        required: true
        type: choice
        default: smoke-001
        options:
          - smoke-001
          - advanced-001
          - robustness-001

permissions:
  contents: read

concurrency:
  group: manual-llm-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed experiment
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run bounded real inference and grade responses
        id: evaluate
        env:
          EVALUATION_EXPERIMENT: ${{ inputs.experiment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          PYTHONPATH: src
          EVALUATION_OUTPUT_DIR: evaluation-output
        run: python -m llm_eval.run_evaluation
      - name: Validate report identity, scoring and artifact integrity
        if: ${{ !cancelled() && (steps.evaluate.outcome == 'success' || steps.evaluate.outcome == 'failure') }}
        env:
          EVALUATION_EXPERIMENT: ${{ inputs.experiment }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          EVALUATION_OUTPUT_DIR: evaluation-output
          PYTHONPATH: src
        run: python -m llm_eval.report_validation
      - name: Upload evaluation evidence (even on provider errors)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: graded-evaluation-${{ github.run_id }}
          path: |
            evaluation-output/results.json
            evaluation-output/report.md
          retention-days: 7
          if-no-files-found: error
